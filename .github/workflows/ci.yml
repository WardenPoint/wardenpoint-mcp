name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (package.json engines) and current.
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Packs the package, installs the tarball into an empty directory and
      # runs it from there. The one bug this project can actually ship is a
      # package that works in a checkout and not for anybody else.
      - run: npm test
